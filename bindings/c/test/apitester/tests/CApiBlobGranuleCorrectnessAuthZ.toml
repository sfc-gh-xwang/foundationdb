[[test]]
title = 'Blob Granule API Tenant Encryption Correctness Multi Threaded with AuthZ'
multiThreaded = true
buggify = true
minFdbThreads = 2
maxFdbThreads = 8
minClients = 1
maxClients = 8
untrustedClient = true
authzSetTokenAtTenant = true
preBlobbifyTenants = true
minTenants = 2
maxTenants = 6

[[server]]
tls_enabled = true
authz_enabled = true
blob_granules_enabled = true
enable_encryption_at_rest = true

[[test.workload]]
name = 'ApiBlobGranuleCorrectness'
minKeyLength = 1
maxKeyLength = 64
minValueLength = 1
maxValueLength = 1000
maxKeysPerTransaction = 50
initialSize = 100
numRandomOperations = 100
