[[test]]
title = 'Bulk Load API Correctness Multi Threaded with AuthZ'
multiThreaded = true
buggify = true
minFdbThreads = 2
maxFdbThreads = 8
minDatabases = 2
maxDatabases = 8
minClientThreads = 2
maxClientThreads = 8
minClients = 2
maxClients = 8
untrustedClient = true
authzSetTokenAtTenant = true
minTenants = 2
maxTenants = 6

[[server]]
tls_enabled = true
authz_enabled = true
blob_granules_enabled = true
knob_allow_bulk_loads = true

[[test.workload]]
name = 'BulkLoadCorrectness'
minKeyLength = 1
maxKeyLength = 64
minValueLength = 1
maxValueLength = 1000
maxKeysPerTransaction = 50
initialSize = 0
numRandomOperations = 100

[[knobs]]
allow_bulk_loads=true
