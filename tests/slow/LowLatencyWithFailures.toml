[configuration]
minimumReplication = 2

[[test]]
testTitle = 'LowLatencyWithFailures'
connectionFailuresDisableDuration = 60

    [[test.workload]]
    testName = 'Cycle'
    transactionsPerSecond = 250.0
    testDuration = 200.0
    expectedRate = 0

    [[test.workload]]
    testName = 'LowLatency'
    testDuration = 200.0
    maxGRVLatency = 50.0
    testWrites = false

    [[test.workload]]
    testName = 'Attrition'
    machinesToKill = 1
    machinesToLeave = 3
    reboot = true
    testDuration = 200.0
    waitForVersion = true
    allowFaultInjection = false
    killDc = false
