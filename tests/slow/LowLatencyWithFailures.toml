[configuration]
minimumReplication = 2

[[knobs]]
rest_request_max_retry_delay_sec = 2.0
# Extending the leader election polling frequency can cause long recovery outages in rare cases where the leader 
# doesn't converge immediately. Use the default values for the following two knobs to prevent them from being buggified.
polling_frequency = 2.0
heartbeat_frequency = 0.5

[[test]]
testTitle = 'LowLatencyWithFailures'
connectionFailuresDisableDuration = 60

    [[test.workload]]
    testName = 'Cycle'
    transactionsPerSecond = 250.0
    testDuration = 200.0
    expectedRate = 0

    [[test.workload]]
    testName = 'LowLatency'
    testDuration = 200.0
    maxGRVLatency = 50.0
    testWrites = false

    [[test.workload]]
    testName = 'Attrition'
    machinesToKill = 1
    machinesToLeave = 3
    reboot = true
    testDuration = 200.0
    waitForVersion = true
    allowFaultInjection = false
    killDc = false
