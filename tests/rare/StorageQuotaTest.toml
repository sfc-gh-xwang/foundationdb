[configuration]
allowDefaultTenant = false
blobGranulesEnabled = true
tenantModes = ['optional', 'required']

[[knobs]]
storage_quota_enabled = true
allow_bulk_loads = true
bulk_load_aware_storage_quota_enforcement = true

[[test]]
testTitle = 'TenantCreation'
clearAfterTest = false

    [[test.workload]]
    testName = 'CreateTenant'
    name = 'First'
    group = 'GroupA'

    [[test.workload]]
    testName = 'CreateTenant'
    name = 'Second'
    group = 'GroupA'

    [[test.workload]]
    testName = 'CreateTenant'
    name = 'Third'
    group = 'GroupB'

    [[test.workload]]
    testName = 'CreateTenant'
    name = 'Fourth'
    group = 'GroupB'

[[test]]
testTitle = 'StorageQuota'

    [[test.workload]]
    testName = 'StorageQuota'
    group = 'GroupA'
    tenant = 'First'
    nodeCount = 250000
    emptyTenant = 'Second'

    [[test.workload]]
    testName = 'StorageQuota'
    group = 'GroupB'
    tenant = 'Third'
    nodeCount = 25000
    emptyTenant = 'Fourth'
