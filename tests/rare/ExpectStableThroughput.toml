[configuration]
tenantModes = ['disabled']
generateFearless = false
# TODO: Support multiple GRV proxies
grvProxyCount = 1

[[test]]
testTitle='ExpectStableThroughput'

  [[test.workload]]
  testName='TagThroughputQuota'
  prefix='testTag'
  count=2
  totalQuotaInPages=1000

  [[test.workload]]
  testName='ExpectStableThroughput'
  tagPrefix='testTag'
  numTags=2
  expectedThroughputPagesRate=1000
  attemptedThroughputPagesRate=2000
  # The error tolerance has to be this high because
  # frequent injected failures can cause repeated spikes in
  # throttling behavior. We should only very rarely need
  # the full error tolerance to be 0.5, but it is set this
  # high to avoid spurious failures.
  errorTolerance=0.5
  numActors=100
