# This test can't run as part of RandomUnitTests.toml, so run it less frequently
testPriority = '10'

[configuration]
# set testClass only when global mock DD is needed
# testClass = 'MockDD'
simHTTPServerEnabled = false

[[knobs]]
enable_dd_physical_shard = false
shard_encode_location_metadata = false
dd_tenant_awareness_enabled = false
storage_quota_enabled = false

[[test]]
testTitle = 'MockDDReadWriteTest'
useDB = false

    [[test.workload]]
    testName = 'MockDDReadWrite'
    keySpaceCount = 1000
    testDuration = 500.0