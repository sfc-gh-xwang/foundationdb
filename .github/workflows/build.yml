name: Build

on:
  pull_request:
    branches: [ "main", "release/*" ]
    types: ['opened', 'edited', 'reopened', 'synchronize']

jobs:
  macos-build:
    runs-on: macos-latest-xl
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install ninja
      - name: Build
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          ninja -j 12
